name: site

# Despliega docs/ en https://dentread-social.pages.dev.
#
# `publish.yml` ya lo hace despues de cada publicacion. Esto cubre lo otro:
# un cambio a mano en docs/ (rehacer paginas, cambiar el formato) y el
# despliegue a pedido. Los commits del bot no lo disparan —un push hecho con
# GITHUB_TOKEN no arranca otros workflows—, asi que no hay doble despliegue.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/**"]

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4          # TODO: pinear por SHA
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.40.0 pages deploy docs \
            --project-name dentread-social --branch main --commit-dirty=true
