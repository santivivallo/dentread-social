name: publish

permissions:
  contents: write        # necesario solo para publicar docs/ en Pages
  pages: write
  id-token: write

concurrency:
  group: social-publish
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Carpeta existente (vacío = generar una nueva)"
        required: false
      dry_run:
        type: boolean
        default: true
  schedule:
    # Lun, Mie y Vie 09:00 ET (13:00 UTC en horario de verano).
    # Tres por semana es la cadencia objetivo; el techo
    # estructural es 3,33/sem, asi que va justo pero entra.
    - cron: "0 13 * * 1,3,5"

jobs:
  publish:
    runs-on: ubuntu-latest
    # 25 y no 15: `tools.recuperar --ada --refetch` dejó 125 artículos
    # marcados para volver a bajar con texto completo, y esos GET los paga la
    # corrida siguiente. Con Chromium (~2 min) y los ocho tests, 15 quedaba
    # demasiado cerca del borde para una falla que se puede prever.
    timeout-minutes: 25
    environment: production

    steps:
      # Pinear por SHA antes de usar en serio: gh api repos/actions/checkout/commits/v4 --jq .sha
      - uses: actions/checkout@v4          # TODO: pinear por SHA
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5      # TODO: pinear por SHA
        with:
          python-version: "3.12"

      - name: Kill switch
        env:
          PAUSED: ${{ vars.SOCIAL_PUBLISHING_PAUSED }}
        run: |
          if [ "$PAUSED" = "true" ]; then
            echo "::warning::Pausado por SOCIAL_PUBLISHING_PAUSED"
            exit 1
          fi

      # Ningun secreto en archivos versionados. El repo es publico: un
      # descuido en un .md no lo atrapa .gitignore.
      - name: Scan for secrets
        run: python -m tools.scan_secrets

      - name: Install deps
        run: pip install -r requirements.txt

      # El renderer es HTML -> Playwright (brand/SKILL.md: "no reconstruyas
      # el motor"). Chromium pesa ~150 MB; --with-deps trae las librerias de
      # sistema que faltan en el runner.
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # Genera los 27 posts posibles en memoria y valida forma y caption.
      # Barato (<1 s) y atrapa justo lo que rompio la primera corrida real:
      # un camino que nadie probo a mano.
      - name: Test generation
        run: python -m tests.test_generate

      # Contraste y tamano de texto. Personas reales reportaron que
      # costaba leer los primeros carruseles; el gris secundario daba
      # 3,2:1 sobre fondo oscuro y el cuerpo quedaba en 8 pt en telefono.
      - name: Test legibility
        run: python -m tests.test_legibility

      # Que los tres frames digan tres cosas distintas. 14 de los 22 temas
      # parafraseaban el gancho en el frame 2 y otra vez en el cierre: el
      # carrusel no avanzaba, giraba. No se ve leyendo un post suelto.
      - name: Test redaction
        run: python -m tests.test_redaccion

      # Que el selector distinga calidad. El sistema pide 4 candidatos y
      # elige; si el selector no ordena mejor que 70% sobre pares conocidos,
      # pedir 4 en vez de 1 es gastar 4x sin ganar nada.
      - name: Test selection
        run: python -m tests.test_seleccion

      # Que el texto no cambie QUE MIDE una cifra. El numero puede estar
      # bien y la frase ser falsa: 'honorario' contado como 'costo
      # operativo'. Es el modo de falla mas peligroso porque se lee mejor
      # que el original.
      - name: Test referents
        run: python -m tests.test_referentes

      # Que una saturacion del proveedor no se lleve el post del dia. El 17 de
      # septiembre dos de tres candidatos murieron con un 503 que el propio
      # mensaje describia como temporal, y la corrida termino 0/1.
      - name: Test model client
        run: python -m tests.test_llm

      # Relevancia de ADA News y el aro del resumen: que la copia literal y
      # los claims clinicos se descarten sigue siendo cierto.
      - name: Test sources
        run: python -m tests.test_archive

      # Que noticias y papers lleguen al resumidor con texto suficiente.
      # Estuvieron un mes muriendo por fuente corta: 10 posts publicados y
      # ninguno de esas dos fuentes, teniendo la mitad de las ranuras.
      - name: Test external sources
        run: python -m tests.test_fuentes_externas

      # Auditoria de los 26 posts posibles, ordenados de peor a mejor.
      #
      # NO bloquea, y es deliberado: audita TODO el catalogo, no el post del
      # dia. Frenar la publicacion de hoy porque otro post tiene un problema
      # seria castigar al que esta bien. El corte por post sigue donde
      # corresponde, en el guard de build_one.
      #
      # Queda en el log de la corrida para que el deterioro se vea antes de
      # que llegue al feed: si el promedio baja, algo se rompio.
      - name: Audit quality
        continue-on-error: true
        run: python -m pipeline.auditoria --peores 8

      - name: Generate
        if: ${{ !inputs.folder }}
        env:
          # Modelo de lenguaje. Redacta dos cosas, las dos verificadas antes
          # de publicarse:
          #   - el resumen de una noticia o un paper (pipeline/summarize)
          #   - el gancho y los titulares de un post de datos
          #     (pipeline/redaccion)
          # Si falta o falla, el post sale con el formato senalizador y el
          # gancho curado del tema. Nunca se rompe una corrida por esto.
          #
          # Antes esto era GitHub Models con el token del runner, sin clave
          # propia. GitHub Models se retiro el 30 de julio de 2026 y empezo a
          # devolver 410; como el codigo cae al texto curado cuando la llamada
          # falla, dejo de resumir en silencio. Por eso el proveedor ahora es
          # configurable: si este tambien cierra, se cambian los secretos.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_ENDPOINT: ${{ vars.LLM_ENDPOINT }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python -m pipeline.run --slots 1

      # Verificable · breve · con inventario · con activo indexable.
      # Si algo falla, no se publica.
      - name: Verify
        run: python -m pipeline.verify --strict

      - name: Resolve folder
        id: pick
        run: |
          if [ -n "${{ inputs.folder }}" ]; then
            echo "dir=${{ inputs.folder }}" >> "$GITHUB_OUTPUT"
          else
            # La carpeta la anota `pipeline.run` en out/.ultimo. Antes se
            # adivinaba con `ls -d out/*/ | tail -1`, la ultima por orden
            # ALFABETICO: con un post nuevo en 2026-09-16-news-4297932 y una
            # carpeta vieja en 2026-09-16-sin-seguro que vuelve del repo con
            # solo su published.json, ganaba la vieja y publish.py moria con
            # "falta post.json".
            echo "dir=$(cat out/.ultimo)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/cache@v4             # TODO: pinear por SHA
        with:
          path: .tokens.enc
          key: social-tokens-${{ github.run_id }}
          restore-keys: social-tokens-

      - name: Publish
        env:
          TOKEN_STORE_KEY: ${{ secrets.TOKEN_STORE_KEY }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_ORG_URN: ${{ secrets.LINKEDIN_ORG_URN }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PUBLIC_BASE: ${{ secrets.S3_PUBLIC_BASE }}
        run: |
          # LinkedIn queda fuera mientras no este aprobado el Dev Tier de
          # Community Management. Sin esto el publicador postea en Instagram
          # y despues falla en LinkedIn: la corrida figura en rojo, el paso
          # de commit no corre y el estado de rotacion no se guarda, asi que
          # la corrida siguiente republica lo mismo.
          ONLY=""
          if [ -z "${LINKEDIN_ACCESS_TOKEN}" ]; then
            ONLY="--only instagram"
            echo "::notice::LinkedIn sin credenciales; se publica solo en Instagram"
          fi
          python publish.py "${{ steps.pick.outputs.dir }}" $ONLY \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # El commit cumple dos funciones: persiste la rotación y las páginas,
      # y mantiene el repo activo. GitHub desactiva los cron programados tras
      # 60 días sin actividad — un modo de falla silencioso y real.
      - name: Commit state and pages
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "dentread-bot"
          git config user.email "bot@dentread.app"
          # -f porque out/ esta en .gitignore: el registro de publicacion
          # SI tiene que persistir, o un re-run despues de una falla
          # parcial volveria a postear en la plataforma que ya salio.
          # data/ada_archive.json es estado, no cache: guarda los 593
          # articulos vistos, hasta donde llego el crawl y cuales ya se
          # publicaron. No estaba en esta lista, asi que cada corrida
          # empezaba con el archivo del repo: la profundidad del crawl se
          # perdia y el flag `used` de la nota recien publicada tambien.
          # data/bitacora.jsonl es el registro que lee la revision quincenal.
          # Si no se commitea, los descartes y las llamadas al modelo se van
          # con el runner y la revision no tiene nada que medir: exactamente
          # el mismo error que dejaba caer el flag `used` del archivo de ADA.
          # data/pubmed_archive.json es la memoria de la literatura vista:
          # PubMed no recuerda nada entre consultas, y sin commitearlo el
          # motivo por el que se descarta cada estudio se va con el runner.
          git add data/rotation.json data/ada_archive.json \
                  data/pubmed_archive.json data/bitacora.jsonl docs || true
          git add -f out/*/published.json || true
          git diff --staged --quiet || git commit -m "content: $(date +%F)"
          git push

      - uses: actions/upload-artifact@v4   # TODO: pinear por SHA
        if: always()
        with:
          name: run-log-${{ github.run_id }}
          path: |
            out/**/published.json
            data/rotation.json
          retention-days: 90
